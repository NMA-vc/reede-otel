name: publish

# Runs only for a version tag such as v0.8.0. Each registry job checks that the tag matches
# its manifest version, runs the tests, then publishes.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pypi:
    name: PyPI (trusted publishing)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC for PyPI trusted publishing; no API token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches python/pyproject.toml version
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"$" python/pyproject.toml
      - name: Test
        run: |
          python -m pip install ./python pytest
          pytest python/tests
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build python/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

  npm:
    name: npm (@reede/otel)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # --provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        run: test "$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME#v}"
      - name: Test
        run: npm test
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
