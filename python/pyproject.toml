[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reede-otel"
version = "0.1.0"
description = "Configure an OpenTelemetry exporter for Reede (reede serve). Nothing more."
license = { text = "Apache-2.0" }
requires-python = ">=3.9"

[tool.setuptools]
packages = ["reede_otel"]
